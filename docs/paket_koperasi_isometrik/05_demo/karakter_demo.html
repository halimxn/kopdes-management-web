<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo Karakter Isometrik</title><style>body{margin:0;font-family:Inter,"Segoe UI",sans-serif;background:linear-gradient(135deg,#EEF2FF,#DDE6FB);color:#1E2A4A;min-height:100vh}
.wrap{max-width:940px;margin:0 auto;padding:20px}h1{font-size:20px;margin:6px 0 2px}p{margin:0 0 12px;color:#5E6C93;font-size:14px}
.card{background:#fff;border-radius:24px;box-shadow:0 8px 24px rgba(59,91,219,.16);padding:12px}
svg{width:100%;height:auto;display:block}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}
button{border:0;border-radius:999px;padding:10px 16px;background:#fff;color:#1E2A4A;font:600 13px inherit;box-shadow:0 4px 12px rgba(59,91,219,.12);cursor:pointer}
button.on{background:#2F5BEA;color:#fff}select{border:0;border-radius:999px;padding:10px 14px;font:600 13px inherit;background:#fff}
#state{font-size:12px;color:#5E6C93;margin-left:auto}
.sheet{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.cell{background:#fff;border-radius:16px;text-align:center;padding:6px 2px;box-shadow:0 6px 16px rgba(59,91,219,.1)}.cell svg{width:100%;height:120px}.cell b{font-size:11px;display:block}.row{font-size:12px;font-weight:700;color:#2F5BEA;margin:14px 0 6px}</style>
<div class="wrap"><h1>Demo karakter: jalan · duduk · kerja · berpikir</h1><p>Satu karakter, satu mesin keadaan. Coba tiap tombol dan ganti seragam.</p>
<div class="bar"><button data-m="auto">Otomatis</button><button data-m="walk">Jalan</button><button data-m="sit">Duduk</button><button data-m="work">Kerja (mengetik)</button><button data-m="think">Berpikir</button><button data-m="wave">Lambai</button><select id="outfit"></select><span id="state"></span></div>
<div class="card"><svg id="stage" viewBox="150 130 600 400"></svg></div></div>
<script>/* Karakter isometrik chibi — satu sumber untuk demo, sprite sheet, dan web asli.
   drawChar({pose, frame, face, flip, shirt, pants, hair, skin, acc, t}) -> string SVG, kaki di (0,0). */
const INK='#1E2A4A';
function drawChar(o){
  const {pose='idle',frame=0,face='front',flip=false,shirt='#5B84F5',pants='#3A4A7A',hair='#2A2F4A',skin='#FBE3D0',acc='',t=0}=o;
  const sit=pose==='sit'||pose==='work', back=face==='back';
  let bob=0,aL=0,aR=0,lL=0,lR=0;
  if(pose==='walk'){const fr=((frame%4)+4)%4;lL=fr===1?1:0;lR=fr===3?1:0;bob=(fr%2)?-2.2:0;aL=(lL?-18:lR?18:0);aR=-aL;}
  if(pose==='idle'){bob=Math.sin(t*2)*.8;}
  if(sit){bob=3;}
  if(pose==='work'){aL=-50+Math.sin(t*16)*7;aR=-50+Math.cos(t*16)*7;}
  if(pose==='sit'){aL=back?-25:-80;aR=back?-25:-80;}
  const shoe='#243056';
  const leg=(x,ang,lift=0)=>`<g transform="translate(0,${-lift*3.5}) rotate(${ang} ${x} -17)"><rect x="${x-3.5}" y="-17" width="7" height="16" rx="3.5" fill="${pants}"/><rect x="${x-4.2}" y="-4.5" width="8.4" height="4.5" rx="2.2" fill="${shoe}"/></g>`;
  let legs='';
  if(sit&&!back){legs=`<rect x="-4" y="-16" width="17" height="7" rx="3.5" fill="${pants}"/><rect x="7" y="-14" width="7" height="14" rx="3.5" fill="${pants}"/><rect x="6" y="-4.5" width="9" height="4.5" rx="2.2" fill="${shoe}"/><rect x="-6" y="-16" width="10" height="7" rx="3.5" fill="${sh(pants)}"/>`;}
  else if(sit&&back){legs=`<rect x="-9" y="-15" width="7" height="15" rx="3.5" fill="${pants}"/><rect x="2" y="-15" width="7" height="15" rx="3.5" fill="${pants}"/><rect x="-9.5" y="-4.5" width="8.4" height="4.5" rx="2.2" fill="${shoe}"/><rect x="1.2" y="-4.5" width="8.4" height="4.5" rx="2.2" fill="${shoe}"/>`;}
  else legs=leg(-3.8,lL*16,lL)+leg(3.8,-lR*16,lR);
  const arm=(sx,ang)=>`<g transform="rotate(${ang} ${sx} -31)"><rect x="${sx-2.7}" y="-32" width="5.4" height="15" rx="2.7" fill="${shirt}"/><circle cx="${sx}" cy="-16.5" r="3" fill="${skin}"/></g>`;
  let armL=arm(-11.5,aL), armR=arm(11.5,aR);
  if(pose==='think') armR=`<path d="M11.5,-30 L16,-22 L5,-35" stroke="${shirt}" stroke-width="5.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="4.5" cy="-35.5" r="3" fill="${skin}"/>`;
  if(pose==='wave'){const w=Math.sin(t*9)*18;armR=`<g transform="rotate(${w} 17 -40)"><path d="M11.5,-30 L17,-40 L18,-53" stroke="${shirt}" stroke-width="5.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="-54" r="3" fill="${skin}"/></g>`;}
  let torso=`<rect x="-10.5" y="-36" width="21" height="22" rx="9" fill="${shirt}"/>`;
  if(acc.includes('blazer')) torso+=`<path d="M-10.5,-30 q0,-6 10.5,-6 q10.5,0 10.5,6 v10 q-2,2 -4,2 l-6.5,-12 l-6.5,12 q-2,0 -4,-2z" fill="${sh(shirt,.82)}"/><path d="M-2.5,-35 l2.5,7 l2.5,-7z" fill="#fff"/>`;
  if(acc.includes('lanyard')&&!back) torso+=`<path d="M-4,-35 L0,-20 L4,-35" stroke="#2F5BEA" stroke-width="2" fill="none"/><rect x="-3.5" y="-21" width="7" height="8" rx="1.8" fill="#fff" stroke="#2F5BEA" stroke-width="1"/><rect x="-2" y="-19" width="4" height="1.6" fill="#2F5BEA"/>`;
  let head=`<circle cx="0" cy="-45" r="10.5" fill="${skin}"/>`;
  const hij=acc.includes('hijab');
  if(hij){head=`<circle cx="0" cy="-44" r="12.3" fill="${hair}"/><path d="M-9,-36 q9,10 18,0 v6 q-9,6 -18,0z" fill="${hair}"/>`+(back?'':`<ellipse cx="0" cy="-44" rx="8" ry="8.8" fill="${skin}"/>`);}
  else if(back) head+=`<circle cx="0" cy="-45.5" r="10.8" fill="${hair}"/>`;
  else head+=`<path d="M-10.8,-45 a10.8,10.8 0 0 1 21.6,0 q-5,-5 -10.8,-3.5 q-5.8,-1.5 -10.8,3.5z" fill="${hair}"/>`;
  if(!back){head+=`<circle cx="-3.6" cy="-43.5" r="1.5" fill="${INK}"/><circle cx="3.6" cy="-43.5" r="1.5" fill="${INK}"/><ellipse cx="-6.3" cy="-40" rx="2" ry="1.2" fill="#F5A3B5" opacity=".6"/><ellipse cx="6.3" cy="-40" rx="2" ry="1.2" fill="#F5A3B5" opacity=".6"/>`;
    if(acc.includes('glasses')) head+=`<circle cx="-3.8" cy="-43.5" r="3.4" fill="none" stroke="${INK}" stroke-width="1"/><circle cx="3.8" cy="-43.5" r="3.4" fill="none" stroke="${INK}" stroke-width="1"/><path d="M-0.4,-43.5h.8" stroke="${INK}"/>`;}
  if(acc.includes('helmet')) head+=`<path d="M-11.5,-47 a11.5,11.5 0 0 1 23,0z" fill="#FFC93C"/><rect x="-12.5" y="-48" width="25" height="3" rx="1.5" fill="#F0B020"/>`;
  if(acc.includes('cap')) head+=`<path d="M-11,-47 a11,11 0 0 1 22,0z" fill="#F8CFE0"/><rect x="-1" y="-48" width="15" height="3" rx="1.5" fill="#EFB5CC"/>`;
  const upper=`<g transform="translate(0,${bob})">${back?armL:''}${torso}${head}${back?'':armL}${armR}</g>`;
  const shadow=`<ellipse cx="${sit&&!back?5:0}" cy="1" rx="${sit?15:12}" ry="5" fill="#1E2A4A" opacity=".13"/>`;
  const body=`${shadow}<g transform="translate(0,${pose==='walk'?bob*.4:0})">${legs}</g>${upper}`;
  return flip?`<g transform="scale(-1,1)">${body}</g>`:body;
}
function sh(c,f=.85){c=c.replace('#','');const n=[0,2,4].map(i=>Math.round(parseInt(c.substr(i,2),16)*f));return '#'+n.map(v=>v.toString(16).padStart(2,'0')).join('');}
const OUTFITS={
 manajer:{shirt:'#2F5BEA',pants:'#2B3558',hair:'#2A2F4A',acc:'blazer lanyard',label:'Manajer (Anda)'},
 admin:{shirt:'#F8CFE0',pants:'#4A5784',hair:'#8A5A7A',acc:'hijab',label:'Staf Admin'},
 bendahara:{shirt:'#BFE8D2',pants:'#3A4A7A',hair:'#2A2F4A',acc:'glasses',label:'Bendahara'},
 gudang:{shirt:'#FBD9C3',pants:'#3A4A7A',hair:'#4A3A2A',acc:'helmet',label:'Petugas Gudang'},
 kurir:{shirt:'#FCEBB5',pants:'#4A5784',hair:'#2A2F4A',acc:'cap',label:'Kurir Mitra'},
 lapangan:{shirt:'#B9C4F2',pants:'#2B3558',hair:'#5A3A2A',skin:'#E8B896',acc:'',label:'Staf Lapangan'}
};

const $=s=>document.querySelector(s);
const W=900,H=540;
const P=[[250,330],[450,420],[660,330],[560,285]];   // waypoint jalan
const CH=[430,282];                                    // posisi kursi (titik duduk)
const BUB=['Tugas A tenggat besok','Rapat jam 14.00?','Kopi dulu ☕','Cek stok gudang','Gerai 4 siap buka?','Catatan kas belum rapi'];
const S={x:P[0][0],y:P[0][1],state:'walk',wp:1,ft:0,face:'front',flip:false,t:0,timer:0,mode:'auto',bub:null,bt:0,nb:6,outfit:'manajer',sitFlag:false};
function setMode(m){S.mode=m;S.timer=0;S.sitFlag=false;
  if(m==='sit'||m==='work'){S.x=CH[0];S.y=CH[1];S.state=m;S.face='back';S.flip=false;}
  else if(m==='think'||m==='wave'){S.x=450;S.y=400;S.state=m;S.face='front';S.flip=false;}
  else if(m==='walk'||m==='auto'){S.state='walk';}
  document.querySelectorAll('button[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  $('#state').textContent=m==='auto'?'otomatis: jalan → duduk → kerja → berdiri → jalan':'mode: '+m;
}
function say(){S.bub=BUB[Math.floor(Math.random()*BUB.length)];S.bt=3.6;S.nb=7+Math.random()*9;}
function moveTo(tx,ty,dt,sp=80){const dx=tx-S.x,dy=ty-S.y,d=Math.hypot(dx,dy);
  if(d<3)return true;const k=Math.min(1,sp*dt/d);S.x+=dx*k;S.y+=dy*k;
  S.face=dy<0?'back':'front';S.flip=dx<0;return false;}
function step(dt){
  S.t+=dt;S.timer+=dt;S.nb-=dt;if(S.bt>0)S.bt-=dt;
  if(S.nb<=0&&S.state!=='sit')say();
  const walking=()=>{S.ft+=dt;};
  if(S.mode==='walk'||(S.mode==='auto'&&S.state==='walk')){
    walking();
    const tgt=(S.mode==='auto'&&S.goChair)?CH:P[S.wp];
    if(moveTo(tgt[0],tgt[1],dt)){
      if(S.mode==='auto'&&S.goChair){S.goChair=false;S.state='work';S.face='back';S.flip=false;S.timer=0;}
      else{S.wp=(S.wp+1)%P.length;if(S.mode==='auto'&&S.wp===0)S.goChair=true;}
    }
  } else if(S.mode==='auto'&&S.state==='work'){
    if(S.timer>6.5){S.state='idle';S.face='front';S.timer=0;S.y+=18;S.x+=6;}
  } else if(S.mode==='auto'&&S.state==='idle'){
    if(S.timer>1.2){S.state='walk';}
  }
}
function floor(){return `<polygon points="450,150 800,325 450,500 100,325" fill="#EEF2FF"/><polygon points="100,325 450,500 450,520 100,345" fill="#CBD5EE"/><polygon points="450,500 800,325 800,345 450,520" fill="#B9C4F2"/>
  <path d="M450,150 L800,325 M450,150 L100,325" stroke="#D4DBF2" stroke-width="2" fill="none"/>`;}
function desk(){return `<g><polygon points="400,232 520,232 580,262 460,262" fill="#fff"/><polygon points="460,262 580,262 580,272 460,272" fill="#DDE4F8"/><polygon points="400,232 460,262 460,272 400,242" fill="#E9EEFB"/>
  <polygon points="445,236 480,236 495,243 460,243" fill="#CFE0FF"/><rect x="458" y="272" width="5" height="22" fill="#C9D3EE"/><rect x="574" y="272" width="5" height="22" fill="#C9D3EE"/>
  <text x="490" y="258" font-size="11" font-weight="700" fill="#2F5BEA" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif">TUGAS</text></g>`;}
function chair(){return `<ellipse cx="${CH[0]}" cy="${CH[1]+2}" rx="17" ry="8" fill="#243056"/><rect x="${CH[0]-2}" y="${CH[1]-12}" width="4" height="12" fill="#3A4A7A"/><ellipse cx="${CH[0]}" cy="${CH[1]-13}" rx="16" ry="7.5" fill="#3A4A7A"/>`;}
function bubble(x,y,txt){const w=txt.length*6.3+24;return `<g><rect x="${x-w/2}" y="${y-150}" width="${w}" height="28" rx="14" fill="#fff" style="filter:drop-shadow(0 6px 8px rgba(59,91,219,.18))"/><path d="M${x-5},${y-122} l5,8 l5,-8z" fill="#fff"/><text x="${x}" y="${y-131}" text-anchor="middle" font-size="12" font-weight="600" fill="#1E2A4A" font-family="Inter,Segoe UI,sans-serif">${txt}</text></g>`;}
function render(){
  const f=Math.floor(S.ft*7)%4, o=OUTFITS[S.outfit];
  const pose=S.state==='walk'?'walk':S.state;
  const ch=`<g transform="translate(${S.x.toFixed(1)},${S.y.toFixed(1)}) scale(1.7) ${pose==='sit'||pose==='work'?'translate(0,-6)':''}">${drawChar({pose,frame:f,face:S.face,flip:S.flip,shirt:o.shirt,pants:o.pants,hair:o.hair,skin:o.skin,acc:o.acc,t:S.t})}</g>`;
  const sitting=(S.state==='sit'||S.state==='work');
  $('#stage').innerHTML=floor()+desk()+chair()+ch+(S.bt>0?bubble(S.x,S.y-(sitting?10:0)-20,S.bub):'');
}
let last=performance.now();
function loop(n){const dt=Math.max(0,Math.min(.05,(n-last)/1000));last=n;step(dt);render();requestAnimationFrame(loop);}
document.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$('#outfit').innerHTML=Object.entries(OUTFITS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');
$('#outfit').onchange=e=>S.outfit=e.target.value;
setMode('auto');requestAnimationFrame(loop);
</script></html>
