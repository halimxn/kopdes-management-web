<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo Cuaca & Pencahayaan</title>
<style>
:root{--ink:#1E2A4A}
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",sans-serif;background:#EEF2FF;color:var(--ink)}
.wrap{max-width:1120px;margin:0 auto;padding:16px}h1{font-size:19px;margin:4px 0}p.s{margin:0 0 12px;color:#5E6C93;font-size:13.5px}
.app{position:relative;aspect-ratio:1200/700;border-radius:24px;overflow:hidden;box-shadow:0 8px 24px rgba(59,91,219,.16)}
.app>*{position:absolute;inset:0;width:100%;height:100%}
#sky{transition:none}#tint{mix-blend-mode:multiply;pointer-events:none}#fog{pointer-events:none}#fx{pointer-events:none}#flash{background:#fff;opacity:0;pointer-events:none}
#sun,#moon{position:absolute;inset:auto;width:7%;aspect-ratio:1;height:auto;border-radius:50%;transform:translate(-50%,-50%)}
#sun{background:radial-gradient(circle,#FFF7D6 30%,#FFD98A 60%,rgba(255,217,138,0) 72%)}#moon{background:radial-gradient(circle at 35% 35%,#fff,#DDE4FF 70%);box-shadow:0 0 30px 8px rgba(200,215,255,.45);width:4.5%}
.st{position:absolute;inset:auto;width:3px;height:3px;border-radius:50%;background:#fff}
.hud{position:absolute;inset:auto;left:16px;top:16px;width:auto;height:auto;display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.93);color:var(--ink);border-radius:16px;padding:10px 14px;box-shadow:0 8px 24px rgba(59,91,219,.16);transition:background .6s,color .6s}
.app.dk .hud{background:rgba(31,39,71,.9);color:#fff}.hud b{font-size:15px;display:block}.hud span{font-size:11.5px;opacity:.7}.hud .ic{width:38px;height:38px;border-radius:12px;background:#E3EAFF;display:grid;place-items:center}.app.dk .ic{background:#2C3768}
.card{background:#fff;border-radius:20px;box-shadow:0 8px 24px rgba(59,91,219,.12);padding:14px;margin-top:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{border:0;border-radius:999px;padding:9px 15px;background:#EEF1FA;color:var(--ink);font:600 13px inherit;cursor:pointer}button.on{background:#2F5BEA;color:#fff}
input[type=range]{flex:1;min-width:200px;accent-color:#2F5BEA}input[type=text]{border:1px solid #DDE4F8;border-radius:10px;padding:8px;width:110px;font:inherit}
.lb{font-size:12px;color:#5E6C93;font-weight:600;margin:10px 0 6px}#st{font-size:12px;color:#5E6C93}
.sw{position:absolute;inset:auto}svg text{font-family:Inter,"Segoe UI",sans-serif}
</style>
<div class="wrap"><h1>Demo cuaca & pencahayaan sesuai waktu</h1><p class="s">Geser jam, ganti cuaca, atau putar siklus 24 jam. Semua lapisan (langit, tint, bayangan, lampu, awan, hujan, kabut, petir) hidup di satu halaman.</p>

/* Karakter isometrik chibi — satu sumber untuk demo, sprite sheet, dan web asli.

const INK='#1E2A4A';
function drawChar(o){
  const {pose='idle',frame=0,face='front',flip=false,shirt='#5B84F5',pants='#3A4A7A',hair='#2A2F4A',skin='#FBE3D0',acc='',t=0}=o;
  const sit=pose==='sit'||pose==='work', back=face==='back';
  let bob=0,aL=0,aR=0,lL=0,lR=0;
  if(pose==='walk'){const fr=((frame%4)+4)%4;lL=fr===1?1:0;lR=fr===3?1:0;bob=(fr%2)?-2.2:0;aL=(lL?-18:lR?18:0);aR=-aL;}
  if(pose==='idle'){bob=Math.sin(t*2)*.8;}
  if(sit){bob=3;}
  if(pose==='work'){aL=-50+Math.sin(t*16)*7;aR=-50+Math.cos(t*16)*7;}
  if(pose==='sit'){aL=back?-25:-80;aR=back?-25:-80;}
  const shoe='#243056';
  const leg=(x,ang,lift=0)=>`<g transform="translate(0,${-lift*3.5}) rotate(${ang} ${x} -17)"><rect x="${x-3.5}" y="-17" width="7" height="16" rx="3.5" fill="${pants}"/><rect x="${x-4.2}" y="-4.5" width="8.4" height="4.5" rx="2.2" fill="${shoe}"/></g>`;
  let legs='';
  if(sit&&!back){legs=`<rect x="-4" y="-16" width="17" height="7" rx="3.5" fill="${pants}"/><rect x="7" y="-14" width="7" height="14" rx="3.5" fill="${pants}"/><rect x="6" y="-4.5" width="9" height="4.5" rx="2.2" fill="${shoe}"/><rect x="-6" y="-16" width="10" height="7" rx="3.5" fill="${sh(pants)}"/>`;}
  else if(sit&&back){legs=`<rect x="-9" y="-15" width="7" height="15" rx="3.5" fill="${pants}"/><rect x="2" y="-15" width="7" height="15" rx="3.5" fill="${pants}"/><rect x="-9.5" y="-4.5" width="8.4" height="4.5" rx="2.2" fill="${shoe}"/><rect x="1.2" y="-4.5" width="8.4" height="4.5" rx="2.2" fill="${shoe}"/>`;}
  else legs=leg(-3.8,lL*16,lL)+leg(3.8,-lR*16,lR);
  const arm=(sx,ang)=>`<g transform="rotate(${ang} ${sx} -31)"><rect x="${sx-2.7}" y="-32" width="5.4" height="15" rx="2.7" fill="${shirt}"/><circle cx="${sx}" cy="-16.5" r="3" fill="${skin}"/></g>`;
  let armL=arm(-11.5,aL), armR=arm(11.5,aR);
  if(pose==='think') armR=`<path d="M11.5,-30 L16,-22 L5,-35" stroke="${shirt}" stroke-width="5.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="4.5" cy="-35.5" r="3" fill="${skin}"/>`;
  if(pose==='wave'){const w=Math.sin(t*9)*18;armR=`<g transform="rotate(${w} 17 -40)"><path d="M11.5,-30 L17,-40 L18,-53" stroke="${shirt}" stroke-width="5.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="-54" r="3" fill="${skin}"/></g>`;}
  let torso=`<rect x="-10.5" y="-36" width="21" height="22" rx="9" fill="${shirt}"/>`;
  if(acc.includes('blazer')) torso+=`<path d="M-10.5,-30 q0,-6 10.5,-6 q10.5,0 10.5,6 v10 q-2,2 -4,2 l-6.5,-12 l-6.5,12 q-2,0 -4,-2z" fill="${sh(shirt,.82)}"/><path d="M-2.5,-35 l2.5,7 l2.5,-7z" fill="#fff"/>`;
  if(acc.includes('lanyard')&&!back) torso+=`<path d="M-4,-35 L0,-20 L4,-35" stroke="#2F5BEA" stroke-width="2" fill="none"/><rect x="-3.5" y="-21" width="7" height="8" rx="1.8" fill="#fff" stroke="#2F5BEA" stroke-width="1"/><rect x="-2" y="-19" width="4" height="1.6" fill="#2F5BEA"/>`;
  let head=`<circle cx="0" cy="-45" r="10.5" fill="${skin}"/>`;
  const hij=acc.includes('hijab');
  if(hij){head=`<circle cx="0" cy="-44" r="12.3" fill="${hair}"/><path d="M-9,-36 q9,10 18,0 v6 q-9,6 -18,0z" fill="${hair}"/>`+(back?'':`<ellipse cx="0" cy="-44" rx="8" ry="8.8" fill="${skin}"/>`);}
  else if(back) head+=`<circle cx="0" cy="-45.5" r="10.8" fill="${hair}"/>`;
  else head+=`<path d="M-10.8,-45 a10.8,10.8 0 0 1 21.6,0 q-5,-5 -10.8,-3.5 q-5.8,-1.5 -10.8,3.5z" fill="${hair}"/>`;
  if(!back){head+=`<circle cx="-3.6" cy="-43.5" r="1.5" fill="${INK}"/><circle cx="3.6" cy="-43.5" r="1.5" fill="${INK}"/><ellipse cx="-6.3" cy="-40" rx="2" ry="1.2" fill="#F5A3B5" opacity=".6"/><ellipse cx="6.3" cy="-40" rx="2" ry="1.2" fill="#F5A3B5" opacity=".6"/>`;
    if(acc.includes('glasses')) head+=`<circle cx="-3.8" cy="-43.5" r="3.4" fill="none" stroke="${INK}" stroke-width="1"/><circle cx="3.8" cy="-43.5" r="3.4" fill="none" stroke="${INK}" stroke-width="1"/><path d="M-0.4,-43.5h.8" stroke="${INK}"/>`;}
  if(acc.includes('helmet')) head+=`<path d="M-11.5,-47 a11.5,11.5 0 0 1 23,0z" fill="#FFC93C"/><rect x="-12.5" y="-48" width="25" height="3" rx="1.5" fill="#F0B020"/>`;
  if(acc.includes('cap')) head+=`<path d="M-11,-47 a11,11 0 0 1 22,0z" fill="#F8CFE0"/><rect x="-1" y="-48" width="15" height="3" rx="1.5" fill="#EFB5CC"/>`;
  const upper=`<g transform="translate(0,${bob})">${back?armL:''}${torso}${head}${back?'':armL}${armR}</g>`;
  const shadow=`<ellipse cx="${sit&&!back?5:0}" cy="1" rx="${sit?15:12}" ry="5" fill="#1E2A4A" opacity=".13"/>`;
  const umb=acc.includes('umbrella')?`<g><line x1="15" y1="-30" x2="15" y2="-60" stroke="${INK}" stroke-width="1.6" stroke-linecap="round"/><g transform="translate(8,0)"><path d="M-20,-59 a20,15 0 0 1 40,0 q-10,-5 -20,0 q-10,-5 -20,0z" fill="#F8CFE0"/><path d="M0,-74 v15" stroke="#EFB5CC" stroke-width="1.2"/></g></g>`:'';
  const body=`${shadow}<g transform="translate(0,${pose==='walk'?bob*.4:0})">${legs}</g>${upper}${umb}`;
  return flip?`<g transform="scale(-1,1)">${body}</g>`:body;
}
function sh(c,f=.85){c=c.replace('#','');const n=[0,2,4].map(i=>Math.round(parseInt(c.substr(i,2),16)*f));return '#'+n.map(v=>v.toString(16).padStart(2,'0')).join('');}

const mix=(a,b,k)=>{const A=hex(a),B=hex(b);return tohex(A.map((v,i)=>v+(B[i]-v)*k));};

const K=[[0,'#0F1535','#26306B','#4A5A9C',.55,1,1],[5,'#2A3470','#8E7FB8','#7A7DB5',.38,.85,.6],[6.3,'#7FA6E8','#FFD2B0','#FFD9BC',.22,.3,0],[9,'#A9C8FF','#E8F0FF','#FFF3E0',.05,0,0],[12,'#BBD5FF','#F2F6FF','#FFFFFF',0,0,0],[15.5,'#B4CDF7','#FFF0DC','#FFF0D8',.08,0,0],[17.5,'#8FA8E8','#FFC9A0','#FFC89A',.28,.25,0],[18.7,'#4A4F9A','#F2A0A0','#C58AB0',.35,.7,.1],[20.2,'#1B2250','#3A4590','#5062A8',.5,1,.8],[24,'#0F1535','#26306B','#4A5A9C',.55,1,1]];
function light(h){let i=0;while(i<K.length-2&&h>=K[i+1][0])i++;const a=K[i],b=K[i+1];let k=(h-a[0])/(b[0]-a[0]);k=k*k*(3-2*k);
 return{t1:mix(a[1],b[1],k),t2:mix(a[2],b[2],k),tint:mix(a[3],b[3],k),ta:lerp(a[4],b[4],k),glow:lerp(a[5],b[5],k),star:lerp(a[6],b[6],k)};}
const WX={cerah:{n:'Cerah',cloud:.15,rain:0,fog:0,gray:0,wind:0,storm:0,ic:'sun'},berawan:{n:'Berawan',cloud:.85,rain:0,fog:0,gray:.12,wind:0,storm:0,ic:'cloud'},
 ringan:{n:'Hujan ringan',cloud:.95,rain:150,fog:.08,gray:.24,wind:2,storm:0,ic:'rain'},lebat:{n:'Hujan lebat',cloud:1,rain:430,fog:.15,gray:.38,wind:7,storm:0,ic:'rain'},
 badai:{n:'Badai petir',cloud:1,rain:540,fog:.12,gray:.5,wind:11,storm:1,ic:'bolt'},kabut:{n:'Berkabut',cloud:.4,rain:0,fog:.7,gray:.14,wind:0,storm:0,ic:'fog'}};
function icon(n){const c='#2F5BEA';return {sun:`<svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="#FFB02E"/>${[0,45,90,135,180,225,270,315].map(a=>`<line x1="12" y1="2.5" x2="12" y2="5" stroke="#FFB02E" stroke-width="2" stroke-linecap="round" transform="rotate(${a} 12 12)"/>`).join('')}</svg>`,
 moon:`<svg width="24" height="24" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="#FFD98A"/></svg>`,
 cloud:`<svg width="24" height="24" viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1 0-8 5 5 0 0 1 9.6-1A4.5 4.5 0 0 1 17 18z" fill="${c}"/></svg>`,
 rain:`<svg width="24" height="24" viewBox="0 0 24 24"><path d="M7 14a4 4 0 0 1 0-8 5 5 0 0 1 9.6-1A4.5 4.5 0 0 1 17 14z" fill="${c}"/><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3" stroke="${c}" stroke-width="2" stroke-linecap="round"/></svg>`,
 bolt:`<svg width="24" height="24" viewBox="0 0 24 24"><path d="M7 14a4 4 0 0 1 0-8 5 5 0 0 1 9.6-1A4.5 4.5 0 0 1 17 14z" fill="${c}"/><path d="M12 12l-3 6h3l-1 4 4-7h-3z" fill="#FFB02E"/></svg>`,
 fog:`<svg width="24" height="24" viewBox="0 0 24 24"><path d="M4 8h16M3 12h18M6 16h12" stroke="${c}" stroke-width="2.4" stroke-linecap="round"/></svg>`}[n];}
let T=9,wname='cerah',playing=false,tempReal=null;
const cur={cloud:.15,rain:0,fog:0,gray:0,wind:0,storm:0};
/* bintang */
$('#stars').innerHTML=[...Array(46)].map(()=>`<i class="st" style="left:${Math.random()*100}%;top:${Math.random()*30}%;opacity:${.4+Math.random()*.6}"></i>`).join('');
/* awan */
const clouds=[...Array(7)].map(()=>({x:Math.random()*1300-100,y:40+Math.random()*420,s:.8+Math.random()*.9,v:5+Math.random()*9}));
/* lampu (cahaya) */
$('#glow').innerHTML=META.lamps.map(([x,y])=>{const [a,b]=pj(x,y,2.8),[c,d]=pj(x,y,0);return `<circle cx="${a}" cy="${b}" r="70" fill="url(#rg)"/><ellipse cx="${c}" cy="${d}" rx="75" ry="38" fill="url(#rg)" opacity=".7"/>`}).join('');
/* cuaca: tombol */
$('#wb').innerHTML=Object.entries(WX).map(([k,v])=>`<button data-w="${k}">${v.n}</button>`).join('');
document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{wname=b.dataset.w;tempReal=null;mark();});
function mark(){document.querySelectorAll('[data-w]').forEach(b=>b.classList.toggle('on',b.dataset.w===wname));}
/* hull bayangan */
function hull(P){P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[];for(const p of P){while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}const up=[];for(const p of P.reverse()){while(up.length>1&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}return lo.slice(0,-1).concat(up.slice(0,-1));}
function shadows(h,vis){
  const e=(h>6&&h<18)?Math.sin(Math.PI*(h-6)/12):0, ang=clamp((h-12)/6,-1.2,1.2), len=1.15-.95*e;
  const sx=ang*30*len, sy=(5+7*Math.abs(ang))*len;
  const op=.3*clamp(e*2.6)*vis;
  $('#shadows').setAttribute('opacity',op.toFixed(3));
  $('#shadows').innerHTML=op<.01?'':META.fp.map(([x,y,dx,dy,hh])=>{const base=[[x,y],[x+dx,y],[x+dx,y+dy],[x,y+dy]].map(q=>pj(q[0],q[1],0));const top=base.map(q=>[q[0]+sx*hh,q[1]+sy*hh]);return `<polygon points="${hull(base.concat(top)).map(q=>q.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="#27316B"/>`}).join('');
  return e;
}
/* NPC */
const paths=[{a:[-3,5.7],b:[13.5,5.7],u:0,d:1,v:.07},{a:[6.4,-3],b:[6.4,8.6],u:.5,d:-1,v:.06}];
function npcs(dt,rain,ft){
  let out='';
  for(const p of paths){const sp=p.v*(1+rain/600);p.u+=p.d*dt*sp*(1+rain/800);if(p.u>1){p.u=1;p.d=-1}if(p.u<0){p.u=0;p.d=1}
    const x=lerp(p.a[0],p.b[0],p.u),y=lerp(p.a[1],p.b[1],p.u);const [sx,sy]=pj(x,y,0);
    const wx=(p.b[0]-p.a[0])*p.d,wy=(p.b[1]-p.a[1])*p.d;const dxs=(wx-wy)*.866,dys=(wx+wy)*.5;
    out+=`<g transform="translate(${sx.toFixed(1)},${sy.toFixed(1)}) scale(.85)">${drawChar({pose:'walk',frame:Math.floor(ft*7+(p.v*100))%4,face:dys<0?'back':'front',flip:dxs<0,shirt:p===paths[0]?'#2F5BEA':'#BFE8D2',pants:'#2B3558',acc:(p===paths[0]?'blazer lanyard ':'')+(rain>40?'umbrella':'')})}</g>`;}
  $('#npcs').innerHTML=out;
}
/* canvas hujan */
const cv=$('#fx'),cx=cv.getContext('2d');let drops=[...Array(560)].map(()=>({x:Math.random(),y:Math.random(),v:.8+Math.random()*.6}));let rip=[];
function size(){const r=$('#app').getBoundingClientRect();cv.width=r.width;cv.height=r.height;}size();addEventListener('resize',size);
function rainDraw(dt){const W=cv.width,H=cv.height,k=W/1200;cx.clearRect(0,0,W,H);const n=Math.round(cur.rain);if(n<1)return;
 cx.strokeStyle='rgba(185,205,245,.6)';cx.lineWidth=Math.max(1,1.2*k);cx.beginPath();
 const vx=cur.wind*40*k,vy=900*k;
 for(let i=0;i<n;i++){const d=drops[i];d.y+=d.v*dt*1.1;d.x+=vx*dt/W*d.v;if(d.y>1){d.y=-.05;d.x=Math.random();}if(d.x>1)d.x-=1;
  const X=d.x*W,Y=d.y*H;cx.moveTo(X,Y);cx.lineTo(X-vx*.02*d.v,Y-vy*.02*d.v);}
 cx.stroke();
 if(Math.random()<cur.rain/700){const x=-6+Math.random()*22,y=-4+Math.random()*18,[a,b]=pj(x,y,0);rip.push({x:a*k,y:b*k,r:1,l:1});}
 cx.lineWidth=Math.max(1,k);rip=rip.filter(q=>q.l>0);for(const q of rip){q.r+=dt*14*k;q.l-=dt*1.6;cx.strokeStyle=`rgba(200,215,250,${(q.l*.7).toFixed(2)})`;cx.beginPath();cx.ellipse(q.x,q.y,q.r,q.r*.5,0,0,7);cx.stroke();}
}
let flash=0,nextBolt=4;
function phase(h){return h<4.5?'Dini hari':h<6.3?'Subuh':h<11?'Pagi':h<15?'Siang':h<17.3?'Sore':h<18.8?'Senja':'Malam';}
const fmt=h=>String(Math.floor(h)).padStart(2,'0')+':'+String(Math.floor((h%1)*60)).padStart(2,'0');
let last=performance.now(),ft=0;
function frame(n){const dt=Math.max(0,Math.min(.05,(n-last)/1000));last=n;ft+=dt;
 if(playing){T=(T+dt*1.5)%24;$('#tm').value=T;}
 const tg=WX[wname];for(const k in cur)cur[k]+=(tg[k]-cur[k])*Math.min(1,dt*1.6);
 const L=light(T),g=cur.gray;
 $('#sky').style.background=`linear-gradient(${mix(L.t1,'#98A3BE',clamp(g*1.4,0,.7))},${mix(L.t2,'#A9B3CC',clamp(g*1.4,0,.7))})`;
 const ta=L.ta+g*.55;$('#tint').style.background=mix(L.tint,'#8D9CC4',ta?clamp(g*.55/ta):0);$('#tint').style.opacity=clamp(ta,0,.8);
 const vis=clamp(1-cur.cloud*.55-g*.9);const e=shadows(T,vis);
 const gl=clamp(Math.max(L.glow,g*.9*(e<.5?1:0.3)));$('#scene').style.setProperty('--g',gl);
 $('#scene').querySelectorAll('.win').forEach(w=>w.style.opacity=gl);$('#glow').style.opacity=gl;
 /* matahari & bulan */
 const sv=(T>6&&T<18)?clamp(e*3)*clamp(1-cur.cloud*.9-g):0;
 $('#sun').style.left=(8+(T-6)/12*84)+'%';$('#sun').style.top=(34-26*e)+'%';$('#sun').style.opacity=sv;
 const Tn=T>=18?T-18:T+6,mv=(T>=18||T<6)?L.star*clamp(1-cur.cloud*.8):0;
 $('#moon').style.left=(8+Tn/12*84)+'%';$('#moon').style.top=(34-26*Math.sin(Math.PI*Tn/12))+'%';$('#moon').style.opacity=mv;
 $('#stars').style.opacity=L.star*clamp(1-cur.cloud*.9);
 /* awan */
 const cc=mix('#FFFFFF','#8E99BA',clamp(g*2.2));let cs='',sh='';
 clouds.forEach((c,i)=>{c.x+=c.v*dt*(1+cur.wind*.2);if(c.x>1400)c.x=-300;const o=clamp(cur.cloud*7-i)*(.55+.4*clamp(g*2));
  sh+=`<ellipse cx="${c.x+70*c.s}" cy="${c.y+190*c.s}" rx="${120*c.s}" ry="${34*c.s}" fill="#27316B" opacity="${(o*.1).toFixed(3)}"/>`;
  cs+=`<g transform="translate(${c.x},${c.y}) scale(${c.s})" opacity="${o.toFixed(3)}" fill="${cc}"><ellipse cx="0" cy="0" rx="110" ry="30"/><ellipse cx="-40" cy="-18" rx="55" ry="34"/><ellipse cx="25" cy="-26" rx="62" ry="40"/><ellipse cx="70" cy="-8" rx="45" ry="26"/></g>`;});
 $('#cl').innerHTML=`<defs><filter id="cb"><feGaussianBlur stdDeviation="5"/></filter></defs><g style="mix-blend-mode:multiply" filter="url(#cb)">${sh}</g><g filter="url(#cb)">${cs}</g>`;
 /* kabut */
 const fc=mix('#EEF2FF','#5062A8',clamp(L.ta*1.3));$('#fog').style.background=`linear-gradient(${fc}cc,${fc}66 60%,${fc}b3)`;$('#fog').style.opacity=clamp(cur.fog);
 /* petir */
 if(cur.storm>.5){nextBolt-=dt;if(nextBolt<=0){flash=1;nextBolt=3.5+Math.random()*5;setTimeout(()=>flash=Math.max(flash,.7),140);}}
 flash*=Math.pow(.02,dt);$('#flash').style.opacity=(flash*.75).toFixed(3);
 rainDraw(dt);npcs(dt,cur.rain,ft);
 /* HUD */
 $('#app').classList.toggle('dk',L.glow>.6);
 $('#ic').innerHTML=icon(tg.ic==='sun'&&(T<6||T>=18)?'moon':tg.ic);$('#h1').textContent=tg.n+(tempReal!=null?' · '+Math.round(tempReal)+'°C':'');$('#h2').textContent=phase(T)+' · '+fmt(T);
 $('#tl').textContent=phase(T)+' '+fmt(T);
 requestAnimationFrame(frame);}
$('#tm').oninput=e=>{T=+e.target.value;};
$('#play').onclick=()=>{playing=!playing;$('#play').classList.toggle('on',playing);$('#play').textContent=playing?'⏸ Jeda':'▶ Putar 24 jam';};
$('#now').onclick=()=>{const d=new Date();T=d.getHours()+d.getMinutes()/60;$('#tm').value=T;};
function wmo(c){if(c===0||c===1)return'cerah';if(c===2||c===3)return'berawan';if(c===45||c===48)return'kabut';if([95,96,99].includes(c))return'badai';if([63,65,66,67,81,82].includes(c))return'lebat';if([51,53,55,56,57,61,80].includes(c))return'ringan';return'berawan';}
$('#fetch').onclick=async()=>{const la=$('#lat').value.trim(),lo=$('#lon').value.trim();if(!la||!lo){$('#st').textContent='Isi lintang & bujur dulu.';return;}
 try{$('#st').textContent='Mengambil…';const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,weather_code&timezone=auto`);const j=await r.json();
  wname=wmo(j.current.weather_code);tempReal=j.current.temperature_2m;const d=new Date(j.current.time);T=d.getHours()+d.getMinutes()/60;$('#tm').value=T;mark();$('#st').textContent='Data nyata dimuat.';}
 catch(e){$('#st').textContent='Gagal (cek internet/koordinat). Pakai tombol manual.';}};
const H=new URLSearchParams(location.hash.slice(1));if(H.get('t'))T=+H.get('t');if(H.get('w')&&WX[H.get('w')]){wname=H.get('w');Object.assign(cur,WX[wname]);}
$('#tm').value=T;mark();requestAnimationFrame(frame);
</script></html>
